<script>
    $(document).ready(function () {
        var publications = document.getElementById('scholar-publications');
        // Read the latest saved crawl first; use the CDN only as a fallback.
        var sources = ['https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json'];
        {% if site.google_scholar_stats_use_cdn %}
        sources.push('https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json');
        {% endif %}

        function render(data) {
            if (!data || !data.publications || typeof data.publications !== 'object') return false;
            var papers = Object.keys(data.publications).map(function (id) {
                return {id: id, paper: data.publications[id]};
            }).filter(function (entry) {
                return entry.paper && entry.paper.bib && typeof entry.paper.bib.title === 'string' && entry.paper.bib.title.trim();
            });
            // Keep the saved HTML list if a crawl is empty or malformed.
            if (!papers.length) return false;
            papers.sort(function (a, b) {
                return (Number(b.paper.num_citations) || 0) - (Number(a.paper.num_citations) || 0) ||
                    (parseInt(b.paper.bib.pub_year, 10) || 0) - (parseInt(a.paper.bib.pub_year, 10) || 0) ||
                    a.paper.bib.title.localeCompare(b.paper.bib.title);
            });

            if (publications) {
                var list = document.createElement('ul');
                papers.forEach(function (entry) {
                    var paper = entry.paper;
                    var bib = paper.bib;
                    var item = document.createElement('li');
                    var paragraph = document.createElement('p');
                    var title = document.createElement('span');
                    title.textContent = bib.title;
                    paragraph.appendChild(title);
                    if (bib.author) paragraph.appendChild(document.createTextNode('. ' + bib.author));
                    var venue = bib.citation || bib.journal || bib.conference || '';
                    if (venue) {
                        var citation = document.createElement('em');
                        citation.textContent = venue;
                        paragraph.appendChild(document.createTextNode('. '));
                        paragraph.appendChild(citation);
                    }
                    if (bib.pub_year && venue.indexOf(String(bib.pub_year)) === -1) {
                        paragraph.appendChild(document.createTextNode(' (' + bib.pub_year + ')'));
                    }
                    item.appendChild(paragraph);
                    list.appendChild(item);
                });
                publications.replaceChildren(list);
            }

            var total = document.getElementById('total_cit');
            if (total && Number.isFinite(data.citedby)) total.textContent = data.citedby;
            return true;
        }

        function load(index) {
            if (index >= sources.length) {
                return;
            }
            $.ajax({url: sources[index], dataType: 'json', timeout: 12000})
                .done(function (data) { if (!render(data)) load(index + 1); })
                .fail(function () { load(index + 1); });
        }
        load(0);
    });
</script>
